on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Quarto Publish

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('handbook-pr-{0}', github.event.pull_request.number) || 'gh-pages' }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test site helpers
        run: node --test scripts/tests/*.test.js

      - name: Check generated semester settings
        run: node scripts/sync-semester-settings.mjs --check

      - name: Refresh Canvas semester status images
        run: node scripts/generate-semester-status-svg.mjs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Install system libraries for locked R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libjpeg-dev libtiff-dev \
            libharfbuzz-dev libfribidi-dev libv8-dev libicu-dev

      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Verify locked R package versions
        run: Rscript scripts/check-r-environment.R

      - name: Render Typst handbook
        run: quarto render --profile book

      - name: Render website
        run: quarto render

      - name: Stage PDF download
        run: bash scripts/stage-handbook-pdf.sh

      - name: Check website navigation
        run: node scripts/check_navigation.js _site

      - name: Save rendered website
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Restore rendered website
        uses: actions/download-artifact@v4
        with:
          name: rendered-site
          path: _site/

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
