<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIOL2022 semester status</title>
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.25rem;
      overflow: hidden;
      font-family: Lato, "Helvetica Neue", Arial, sans-serif;
    }

    #semester-status {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0 0.25rem;
      color: #440154;
      font-size: clamp(1.125rem, 2.4vw, 1.4375rem);
      font-weight: 400;
      line-height: 1.4;
      overflow-wrap: anywhere;
      text-align: center;
    }
  </style>
</head>
<body>
  <p id="semester-status" role="status" aria-live="polite">Loading semester status</p>

  <script src="../scripts/semester-config.js"></script>
  <script src="../scripts/semester-calendar.js"></script>
  <script>
    (() => {
      "use strict";
      const settings = window.BedaSemester;
      const query = new URLSearchParams(window.location.search);
      const year = query.get("year") || String(settings["edition-year"]);
      const semester = query.get("semester") || String(settings["edition-semester"]);
      const status = document.getElementById("semester-status");
      if (year !== String(settings["edition-year"]) || semester !== String(settings["edition-semester"])) {
        status.textContent = "Semester schedule unavailable";
        document.documentElement.dataset.state = "unavailable";
        return;
      }
      const { isDate, sydneyDate, messageFor } = window.BedaCalendar;
      const previewDate = query.get("date");
      const date = isDate(previewDate) ? previewDate : sydneyDate();
      status.textContent = messageFor(settings["semester-calendar"], date);
      document.documentElement.dataset.date = date;
    })();
  </script>
</body>
</html>
