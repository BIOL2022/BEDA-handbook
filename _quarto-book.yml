project:
  type: book
  output-dir: _book
  # The selected PDF pages are controlled by book.chapters below.
  render: []

date: today
date-format: "[Semester 2 ·] YYYY"

book:
  title: Biology Experimental Design and Analysis
  subtitle: BIOL2022 Unit Handbook
  author:
    - Dr. Januar Harianto
    - Prof. Clare McArthur
    - Prof. Matthew Crowther
  date: today
  chapters:
    - index.qmd
    - part: "Unit Information"
      chapters:
        - about-unit.qmd
    - part: "Module 1"
      chapters:
        - module01/101-intro.qmd
        - module01/102-week01.qmd
        - module01/103-week02.qmd
        - module01/104-week03.qmd
        - module01/106-species-id.qmd
        - module01/w03-model-fitting-assumptions.qmd
    - part: "Module 2"
      chapters:
        - module02/book-overview.qmd
        - module02/book-timeline.qmd
        - module02/book-projects.qmd
        - module02/book-report1.qmd
        - module02/book-resources.qmd
        - module02/book-rubric.qmd
    - part: "Module 3"
      chapters:
        - module03/301-intro.qmd

format:
  orange-book-typst:
    template-partials:
      - typst/typst-show.typ
papersize: a4
number-sections: true
toc: true

filters:
  - filters/typst-inline-margin-notes.lua
  - filters/typst-book-index.lua
  - filters/module2-timeline-typst.lua

execute:
  freeze: auto
