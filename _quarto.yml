quarto-required: ">=1.9.17"

project:
  type: website
  pre-render:
    - node scripts/sync-semester-settings.mjs
  resources:
    # Anchor to the project root so other profiles' output is not copied back in.
    - /canvas/semester-status.html
    - /canvas/semester-status.svg
    - /canvas/semester-status-narrow.svg
    - /scripts/semester-config.js
    - /scripts/semester-calendar.js
  render:
    - "**/*.qmd"
    - "!_book/**"
    - "!_partials/**"
    - "!renv/**"
    - "!about-unit.qmd"
    - "!module02/book-*.qmd"
    - "!module02/module02-word.qmd"
    - "!parts/**"
    - "!word/title-page-mock-*.qmd"
    - "!word/font-preview.qmd"

metadata-files:
  - _edition.yml
  - _semester.json
filters:
  - word/docx-mockup-table.lua
  - filters/semester-links.lua

website:
  title: "BIOL2022 Handbook"
  search: true
  # draft-mode: gone
  drafts:
    - module01/w02-tidy-data.qmd
    - module03/304-week11.qmd
    - module03/305-week12.qmd
  navbar:
    collapse-below: xl
    left:
      - icon: house-fill
        text: Home
        href: index.qmd
      - icon: info-circle-fill
        text: About
        href: unit-information.qmd
      - icon: clock-history
        text: Updates
        href: updates.qmd
      # - icon: clipboard-check
      #   text: Assessments
      #   href: assessments/assessments.qmd
      - icon: envelope-fill
        text: Contact
        href: help.qmd
      - icon: file-earmark-text
        text: Cheatsheets
        href: cheatsheets.qmd
  page-footer:
    left:
      - text: About this handbook
        href: about-handbook.qmd
  sidebar:
    - id: module-2
      title: "Module 2"
      style: docked
      contents:
        - text: Preamble
          href: module02/200-welcome.qmd
        - text: What this module is about
          href: module02/201-overview.qmd
        - text: Timeline
          href: module02/202-timeline.qmd
        - text: Projects on offer
          href: module02/203-projects.qmd
        - text: Report 1 instructions
          href: module02/204-report1.qmd
        - text: Practical resources
          href: module02/205-resources.qmd
        - text: Report 1 rubric
          href: module02/206-rubric.qmd

format:
  html:
    theme:
      light: zephyr
      dark:
        - zephyr
        - assets/theme-dark.scss
    fontsize: 16px
    include-in-header:
      - _partials/display-preference.html
    include-after-body:
      - _partials/lecture-preview-status.html
    css:
      - assets/timeline.css
      - assets/manual-headings.css
      - assets/handbook-download.css
      - assets/academic-tables.css
      - assets/learning-outcomes.css
      - assets/student-tasks.css
      - assets/display-preference.css
    toc: true

editor:
  render-on-save: true

execute:
  freeze: auto
