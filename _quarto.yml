project:
  type: website
  resources:
    - canvas/semester-status.html
    - canvas/semester-status.svg
    - canvas/semester-status-narrow.svg
  render:
    - "**/*.qmd"
    - "!_book/**"
    - "!_partials/**"

metadata-files:
  - _edition.yml

website:
  title: "BIOL2022"
  search: true
  # draft-mode: gone
  drafts:
    - module01/w02-tidy-data.qmd
    - module01/w03-model-fitting-assumptions.qmd
    - module02/202-timeline.qmd
    - module03/302-week09.qmd
    - module03/303-week10.qmd
    - module03/304-week11.qmd
    - module03/305-week12.qmd
  navbar:
    collapse-below: lg
    left:
      - icon: house-fill
        text: Home
        href: index.qmd
      - icon: info-circle-fill
        text: About
        href: unit-information.qmd
      - icon: clock-history
        text: Updates
        href: updates.qmd
      # - icon: clipboard-check
      #   text: Assessments
      #   href: assessments/assessments.qmd
      - icon: envelope-fill
        text: Contact
        href: help.qmd
      - icon: file-earmark-text
        text: Cheatsheets
        href: cheatsheets.qmd
    right:
      - icon: mortarboard-fill
        text: Canvas
        href: https://canvas.sydney.edu.au/courses/74353/
      - icon: chat-dots-fill
        text: Ed
        href: https://edstem.org/au/courses/36475/
  page-footer:
    left:
      - text: About this handbook
        href: about-handbook.qmd

format:
  html:
    theme: zephyr
    fontsize: 16px
    include-in-header:
      - _partials/display-preference.html
    include-after-body:
      - _partials/lecture-preview-status.html
    css:
      - assets/timeline.css
      - assets/manual-headings.css
      - assets/handbook-download.css
      - assets/academic-tables.css
      - assets/learning-outcomes.css
      - assets/student-tasks.css
      - assets/display-preference.css
    toc: true

editor:
  render-on-save: true

execute:
  freeze: auto
